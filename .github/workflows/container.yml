name: Container

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: container-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/floris/droppert_dev

jobs:
  static-validation:
    name: Static validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate repository
        run: ./scripts/validate.sh --static-only

  pull-request-build:
    name: Build pull-request image
    if: github.event_name == 'pull_request'
    needs: static-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build without publishing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VCS_REF=${{ github.event.pull_request.head.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}

  publish-main:
    name: Publish verified main image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check immutable tag
        id: image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_MANIFEST_URL: https://ghcr.io/v2/floris/droppert_dev/manifests/sha-${{ github.sha }}
        run: |
          set -euo pipefail

          registry_token="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --user "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
              'https://ghcr.io/token?service=ghcr.io&scope=repository%3Afloris%2Fdroppert_dev%3Apull' \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["token"])'
          )"

          manifest_status="$(
            curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --output /dev/null \
              --write-out '%{http_code}' \
              --request HEAD \
              --header "Authorization: Bearer ${registry_token}" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
              "$IMAGE_MANIFEST_URL"
          )"

          case "$manifest_status" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              printf 'Unexpected GHCR manifest response: HTTP %s\n' "$manifest_status" >&2
              exit 1
              ;;
          esac

      - name: Build and publish immutable image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
